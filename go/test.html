<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ammu.fragments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 5vh 20px 30px;
      background: #101012;
      color: #eee8e3;
      font-family: 'Manjari', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 25px;
      background: #19181b;
      border: 1px solid #302b31;
      border-radius: 19px;
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 34px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid #51404b;
      flex-shrink: 0;
    }

    .handle {
      color: #f2dce7;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .bio {
      color: #b9aeb5;
      font-size: 13px;
      margin-top: 3px;
    }

    .insta-icon {
      color: #d99ab5;
      width: 23px;
      height: 23px;
    }

    h1 {
      color: #f4e9e7;
      font-size: 27px;
      line-height: 1.65;
      font-weight: 500;
      margin: 0 0 13px;
    }

    .description {
      color: #c9bec4;
      font-size: 16px;
      line-height: 1.9;
      margin: 0 0 29px;
    }

    .main-button {
      display: grid;
      grid-template-columns: 28px 1fr 34px;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 15px 17px;
      border-radius: 12px;
      background: #d978a3;
      color: #21151c;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      transition: background .2s ease;
    }

    .main-button:hover {
      background: #e58bb2;
    }

    .main-button svg {
      width: 21px;
      height: 21px;
    }

    .arrow-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(35, 18, 28, .14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      border: 1px solid #765365;
      border-radius: 12px;
      background: #292128;
      color: #edc4d7;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .copy-button:hover {
      background: #352631;
      border-color: #bd7c9c;
    }

    .instruction {
      color: #b8a9b1;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      margin: 14px 0 0;
    }

    .footer {
      color: #827781;
      font-family: sans-serif;
      font-size: 11px;
      letter-spacing: 1.1px;
      text-align: center;
      margin-top: 34px;
    }

    @media (min-width: 600px) {
      body {
        padding-top: 9vh;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="top">
      <div class="profile">
        <img class="avatar" src="avatar.webp" alt="Profile picture">
        <div>
          <div class="handle">@ammu.fragments</div>
          <div class="bio">Malayalam · Alternative writing</div>
        </div>
      </div>

      <svg class="insta-icon" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>ഇനിയും ചിലത് പറയാനുണ്ട്.</h1>

    <p class="description">
      ഇതിന്റെ ബാക്കി ഭാഗം ഇൻസ്റ്റഗ്രാമിലുണ്ട്.
      അവിടെ വായിക്കാം.
    </p>

    <a class="main-button" id="openInstagram" href="#">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"
                fill="currentColor" stroke="none"/>
      </svg>

      <span>ഇൻസ്റ്റഗ്രാമിൽ വായിക്കാം</span>

      <span class="arrow-circle">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </span>
    </a>

    <button class="copy-button" id="copyHandle">
      @ammu.fragments കോപ്പി ചെയ്യാം
    </button>

    <p class="instruction" id="copyMessage">
      തുറക്കാൻ കഴിയുന്നില്ലെങ്കിൽ ഹാൻഡിൽ കോപ്പി ചെയ്ത്
      ഇൻസ്റ്റഗ്രാമിൽ സെർച്ച് ചെയ്യൂ.
    </p>

    <div class="footer">
      A LITTLE MORE THAN WORDS.
    </div>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('p');

    const openButton = document.getElementById('openInstagram');

    if (postId && /^[A-Za-z0-9_-]+$/.test(postId)) {
      openButton.href =
        `intent://www.instagram.com/p/${postId}/#Intent;scheme=https;package=com.instagram.android;end`;
    } else {
      openButton.href =
        'intent://www.instagram.com/ammu.fragments/#Intent;scheme=https;package=com.instagram.android;end';
    }

    document.getElementById('copyHandle').addEventListener('click', async () => {
      const message = document.getElementById('copyMessage');

      try {
        await navigator.clipboard.writeText('@ammu.fragments');
        message.textContent = 'ഹാൻഡിൽ കോപ്പി ചെയ്തു. ഇൻസ്റ്റഗ്രാമിൽ സെർച്ച് ചെയ്യൂ.';
      } catch (error) {
        message.textContent = 'കോപ്പി ചെയ്യാൻ കഴിഞ്ഞില്ല. @ammu.fragments കൈകൊണ്ട് കോപ്പി ചെയ്യൂ.';
      }
    });
  </script>
</body>
</html>
