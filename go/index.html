<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">

<title>Continue reading | @ammu.fragments</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 5vh 20px 24px;
  background: #101010;
  color: #fff;
  font-family: Arial, sans-serif;
}

.card {
  position: relative;
  width: 100%;
  max-width: 390px;
  padding: 23px;
  border: 1px solid #333;
  border-radius: 20px;
  background: #191919;
  box-shadow: 0 15px 50px #0008;
}

/* Profile section */

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 36px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 1px solid #444;
  flex-shrink: 0;
}

.handle {
  font-weight: 700;
  font-size: 15px;
}

.bio {
  color: #999;
  font-size: 12px;
  margin-top: 5px;
}

/* Instagram icon - top right */

.top-instagram {
  position: absolute;
  top: 27px;
  right: 24px;
  color: #E1306C;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Divider */

.divider {
  height: 1px;
  background: #383838;
  margin: 19px 0 20px;
}

/* Main content */

h1 {
  font-family: Georgia, serif;
  font-size: 27px;
  line-height: 1.4;
  margin: 0 0 9px;
}

.description {
  color: #aaa;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
}

/* Main Instagram button */

.open-button {
  display: grid;
  grid-template-columns: 28px 1fr 34px;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 58px;
  padding: 9px 12px;
  border-radius: 12px;
  background: #E1306C;
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  transition: background .2s, transform .2s;
}

.open-button:hover {
  background: #d52761;
}

.open-button:active {
  transform: scale(.98);
}

.instagram-icon {
  display: flex;
  justify-content: center;
  align-items: center;
}

.button-text {
  text-align: center;
}

/* Right arrow circle */

.arrow-circle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #ffffff25;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Browser fallback */

.fallback {
  display: block;
  margin-top: 15px;
  color: #aaa;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
  text-decoration: none;
}

.fallback:hover {
  color: #fff;
}

/* Footer */

.footer {
  color: #666;
  text-align: center;
  font-size: 11px;
  margin-top: 19px;
}

.error {
  color: #ff8c8c;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}

/* Accessibility */

.open-button:focus-visible,
.fallback:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

/* Larger screens */

@media (min-height: 750px) and (min-width: 500px) {
  body {
    padding-top: 9vh;
  }
}
</style>
</head>

<body>

<main class="card">

  <!-- Profile -->

  <div class="profile">

    <img
      class="avatar"
      src="avatar.webp"
      alt="@ammu.fragments"
    >

    <div>
      <div class="handle">@ammu.fragments</div>
      <div class="bio">Malayalam · Alternative writing</div>
    </div>

  </div>

  <!-- Top-right Instagram icon -->

  <div class="top-instagram" aria-hidden="true">
    <svg width="27" height="27"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.8"
         stroke-linecap="round"
         stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/>
    </svg>
  </div>

  <div class="divider"></div>

  <!-- Heading -->

  <h1>ഇനിയും ചിലത് പറയാനുണ്ട്.</h1>

  <div class="description">
    ഇതിന്റെ ബാക്കി ഭാഗം ഇൻസ്റ്റഗ്രാമിലുണ്ട്. അവിടെ വായിക്കാം.
  </div>

  <!-- Dynamic Instagram link -->

  <div id="content">
    <p class="error">Preparing your link...</p>
  </div>

  <!-- Footer -->

  <div class="footer">
    A little more than words.
  </div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const postId = params.get("p");

const content = document.getElementById("content");

if (postId && /^[A-Za-z0-9_-]+$/.test(postId)) {

  const instagramURL =
    `https://www.instagram.com/p/${postId}/`;

  const intentURL =
    `intent://www.instagram.com/p/${postId}/` +
    `#Intent;scheme=https;package=com.instagram.android;end`;

  content.innerHTML = `
    <a
      class="open-button"
      href="${intentURL}"
      aria-label="Open this post in Instagram"
    >

      <span class="instagram-icon" aria-hidden="true">
        <svg width="25" height="25"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.9"
             stroke-linecap="round"
             stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="18" cy="6" r="1"
                  fill="currentColor" stroke="none"/>
        </svg>
      </span>

      <span class="button-text">
        Continue reading on Instagram
      </span>

      <span class="arrow-circle" aria-hidden="true">
        <svg width="18" height="18"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M7 17L17 7"/>
          <path d="M7 7h10v10"/>
        </svg>
      </span>

    </a>

    <a
      class="fallback"
      href="${instagramURL}"
      target="_blank"
      rel="noopener noreferrer"
    >
      Having trouble opening Instagram? Open in browser
    </a>
  `;

} else {

  content.innerHTML = `
    <p class="error">
      Invalid or missing Instagram post ID.
    </p>
  `;

}
</script>

</body>
</html>
